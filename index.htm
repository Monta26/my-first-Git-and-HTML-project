<!DOCTYPE html>
<html>
<head>
    <meta charset=""UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A website about studio ghibli animations">
    <title>Studio Ghibli Animation</title>
    <link rel="stylesheet" href ="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body{
            margin: 0;
            padding: 0;
        }
        #navbar{
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: #17391c;
                gap:1px;
                padding: 5px;
            }            
        #navbar a {
                    text-align: center;
                    color: #f5f5f5;
                    text-decoration: none;
                    padding: 15px;
                }
        #navbar a:hover {
                    background: #3a6c45
        }

        #navbar i{
            margin-right:8px;
        }

        #search-box {
            display:flex;
            align-items:center;
            height:10px;
            width:350px;
            margin-left: auto;
            margin-right: 15px;
            position:relative;
            border: none;
            border-radius: 20px;
            padding: 0 5px;
        }

        #search-box i{
            position:absolute;
            left:20px;
            top:50%;
            transform: translateY(-50%);
            color:grey;
        }

        #search-input {
            width: 350px;
            height:30px;
            padding-left: 10px;
            border:none;
            border-radius: 20px;
        }

        #hero {
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content: center;
            min-height: 100vh;
            background-image: url("ghibli bachground.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-align:center;
        }    

       h1{
        text-align: center;
        font-style: normal;
        font-size:80px;
        font-weight: 800;
        text-shadow: 2px 2px 8px black;
       }

       h2{
        text-align: center;
        font-family: puffin-arcade-level, sans-serif;
        font-style: normal;
        font-weight: 800;

       }

       h1, h2 ,h3 ,h4 ,h5 ,h6{
        color:rgb(253, 253, 253);
       }

       p{
        color:rgb(253, 253, 253);
        text-align: center;
        text-decoration:solid;
        font-size:20px;
        text-shadow: 2px 2px 8px black;
        font-weight: 20;
       }



       hr{
        border: none;
        border-top:2px dashed rgb(16, 18, 91);
       }

    </style>

</head>

<body>
    
    <div id="navbar">
        <a href="#home"><i class ="fa-solid fa-house"></i>Home</a>
        <a href="#films"><i class="fa-solid fa-film"></i>Films</a>
        <a href="#directors"><i class="fa-solid fa-clapperboard"></i>Directors</a>
        <a href="#about"><i class="fa-solid fa-circle-info"></i>About</a>
        <a href="#gallery"><i class="fa-solid fa-images"></i>Gallery</a>
        <div id="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="      Search..."id="search-input">
        </div>
    </div>

    <section id="hero">
        <h1>Studio Ghibli</h1>
        <p>Where imagination becomes animation.</p>
    </section>
    

</body>
</html>
