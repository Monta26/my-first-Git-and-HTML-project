<!DOCTYPE html>
<html>
<head>
    <meta charset=""UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A website about studio ghibli animations">
    <title>Studio Ghibli Animation</title>
    <link rel="stylesheet" href ="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body{
            margin: 0;
            padding: 0;
        }
        #navbar{
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: #17391c;
                gap:1px;
                padding: 5px;
            }            
        #navbar a {
                    text-align: center;
                    color: #f5f5f5;
                    text-decoration: none;
                    padding: 15px;
                }
        #navbar a:hover {
                    background: #3a6c45
        }

        #navbar i{
            margin-right:8px;
        }

        #search-box {
            display:flex;
            align-items:center;
            height:10px;
            width:350px;
            margin-left: auto;
            margin-right: 15px;
            position:relative;
            border: none;
            border-radius: 20px;
            padding: 0 5px;
        }

        #search-box i{
            position:absolute;
            left:20px;
            top:50%;
            transform: translateY(-50%);
            color:grey;
        }

        #search-input {
            width: 350px;
            height:30px;
            padding-left: 10px;
            border:none;
            border-radius: 20px;
        }

        h1{
        margin-top:0;
        text-align: center;
        font-style: normal;
        font-size:80px;
        font-weight: 400;
        text-shadow: 2px 2px 8px black;
        margin-bottom: 8px;
       }

       h2{
        text-align: center;
        font-style: normal;
        font-weight: 800;
        font-size:20px;
       }

       h1, h2 ,h3 ,h4 ,h5 ,h6{
        color:rgb(253, 253, 253);
       }

       p{
        color:rgb(253, 253, 253);
        text-align: center;
        text-decoration:solid;
        text-shadow: 2px 2px 8px black;
        font-weight: 20;
       }
